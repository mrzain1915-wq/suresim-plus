name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: suresim-android-${{ github.ref }}
  cancel-in-progress: true

env:
  SURESIM_VERSION: "1.0.1"
  SURESIM_APK: "SureSIM-Plus-v1.0.1-Android.apk"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships an Android SDK (ANDROID_HOME is
      # set by the image) — the same setup the NOWAY builds use. Do NOT
      # use android-actions/setup-android@v3: it failed on run #9
      # ("Failed to find package 'tools'", sdkmanager exit 1) because
      # it tries to install the removed legacy "tools" package.
      # Install SDK 36 with the image's own sdkmanager instead.
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # Use the Gradle Wrapper, not a bare `gradle` command: the runner
      # does not install Gradle, and this project ships a wrapper pinned
      # to Gradle 9.4.1 (gradle/wrapper/gradle-wrapper.properties).
      # chmod +x first: the wrapper can lose its executable bit when the
      # source is uploaded from a phone / zipped on Windows.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify package, signature, version and archive
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          cp "$source_apk" "$SURESIM_APK"
          unzip -tq "$SURESIM_APK"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose --print-certs "$SURESIM_APK"
          badging="$($build_tools/aapt dump badging "$SURESIM_APK")"
          echo "$badging" | head -1
          grep -F "package: name='com.droidtune.suresim' versionCode='2' versionName='1.0.1-debug'" <<<"$badging"

          sha256sum "$SURESIM_APK" > SHA256SUMS-Android.txt
          cat SHA256SUMS-Android.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            ${{ env.SURESIM_APK }}
            SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30

  publish-android-release:
    name: Publish SureSIM Plus v1.0.1 release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Release SureSIM Plus v1.0.1'))
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${SURESIM_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "SureSIM Plus v${SURESIM_VERSION} — Android" --notes-file README.md --latest
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "SureSIM Plus v${SURESIM_VERSION} — Android" --notes-file README.md --latest
          fi
